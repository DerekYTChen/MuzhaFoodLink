<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A community pilot connecting Taipei Zoo visitors with Muzha's independent restaurants near NCCU." />
  <title>Muzha Food Link · 木柵食旅連線</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Nanum+Pen+Script&family=Noto+Serif+TC:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top"><span class="brand-sun">✳</span><span class="brand-name" data-i18n="brand"></span></a>
    <nav aria-label="Primary">
      <a href="#problem" data-i18n="nav.idea"></a>
      <a href="#demand" data-i18n="nav.season"></a>
      <a href="#gap" data-i18n="nav.map"></a>
      <a href="#pilot" data-i18n="nav.plan"></a>
      <a href="#evidence" data-i18n="nav.method"></a>
      <a href="#join" data-i18n="nav.join"></a>
    </nav>
    <div class="header-right">
      <button type="button" id="audio-toggle" class="audio-btn" aria-pressed="false" data-i18n-aria-label="audio.label" data-i18n-title="audio.hint">
        <span class="audio-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="audio-text" data-i18n="audio.off"></span>
      </button>
      <div class="lang-switch" role="group" data-i18n-aria-label="lang.label">
        <button type="button" data-lang="en" class="is-on">EN</button>
        <button type="button" data-lang="zh">繁中</button>
      </div>
      <a class="header-cta" href="#join"><span data-i18n="cta.partner"></span> <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow"><span></span> <span data-i18n="hero.eyebrow"></span></p>
        <h1 data-i18n="hero.h1"></h1>
        <p class="hero-intro" data-i18n="hero.intro"></p>
        <div class="hero-actions">
          <a class="button button-ink" href="#gap"><span data-i18n="hero.btn1"></span> <span aria-hidden="true">↓</span></a>
          <a class="text-link" href="#pilot"><span data-i18n="hero.btn2"></span> <span aria-hidden="true">→</span></a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="rays"></div>
        <div class="hero-label label-top" data-i18n="hero.tag1"></div>
        <div class="panda">◕ᴥ◕</div>
        <div class="noodle-bowl"><div class="steam s1">~</div><div class="steam s2">~</div><div class="steam s3">~</div><span>≋</span></div>
        <div class="path-dots">· · · · · · · · ·</div>
        <div class="hero-label label-bottom" data-i18n="hero.tag2"></div>
      </div>
    </section>

    <section class="problem-strip">
      <p><b data-i18n="strip.label"></b> · <span data-i18n="strip.text"></span></p>
      <a href="#pilot"><span data-i18n="strip.cta"></span> <span aria-hidden="true">↗</span></a>
    </section>

    <section class="about-note section">
      <div class="about-card">
        <p class="about-label" data-i18n="about.label"></p>
        <p class="about-text" data-i18n="about.text"></p>
        <p class="about-who" data-i18n="about.who"></p>
      </div>
    </section>

    <section class="story section" id="problem" aria-labelledby="story-title">
      <div class="section-kicker" data-i18n="story.kicker"></div>
      <div class="story-layout">
        <h2 id="story-title" data-i18n="story.h2"></h2>
        <div class="story-body">
          <p data-i18n="story.p1"></p>
          <p data-i18n="story.p2"></p>
        </div>
      </div>
      <div class="stat-row">
        <div><strong data-i18n="story.s1v"></strong><span data-i18n="story.s1l"></span></div>
        <div><strong data-i18n="story.s2v"></strong><span data-i18n="story.s2l"></span></div>
        <div><strong data-i18n="story.s3v"></strong><span data-i18n="story.s3l"></span></div>
      </div>
    </section>

    <section class="season section" id="demand" aria-labelledby="season-title">
      <div class="map-heading">
        <div><p class="section-kicker" data-i18n="season.kicker"></p><h2 id="season-title" data-i18n="season.h2"></h2></div>
        <div class="season-body">
          <p data-i18n="season.p1"></p>
          <p data-i18n="season.p2"></p>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-scroll">
<!--CHARTFRAG-->
        </div>
        <div class="chart-legend">
          <span><i class="lg lg-hi"></i> <span data-i18n="season.legendHi"></span></span>
          <span><i class="lg lg-avg"></i> <span data-i18n="season.legendAvg"></span></span>
        </div>
        <p class="chart-cap" data-i18n="season.cap"></p>
        <p class="chart-src"><a href="https://www.zoo.gov.taipei/News.aspx?n=5106BA427B3FB592&amp;sms=61B3A9CF957A6445" target="_blank" rel="noopener"><span data-i18n="season.src"></span> <span aria-hidden="true">↗</span></a></p>
      </div>

      <div class="stat-row">
        <div><strong data-i18n="season.s1v"></strong><span data-i18n="season.s1l"></span></div>
        <div><strong data-i18n="season.s2v"></strong><span data-i18n="season.s2l"></span></div>
        <div><strong data-i18n="season.s3v"></strong><span data-i18n="season.s3l"></span></div>
      </div>

      <div class="sizing">
        <div class="sizing-head">
          <p class="section-kicker" data-i18n="size.kicker"></p>
          <h3 data-i18n="size.t"></h3>
          <p class="sizing-lead" data-i18n="size.p1"></p>
        </div>
        <div class="size-scroll">
<!--SIZEFRAG-->
        </div>
        <p class="size-note" data-i18n="size.note"></p>
        <p class="size-rule" data-i18n="size.floor"></p>
      </div>
    </section>

    <section class="map-section section" id="gap" aria-labelledby="map-title">
      <div class="map-heading">
        <div><p class="section-kicker" data-i18n="map.kicker"></p><h2 id="map-title" data-i18n="map.h2"></h2></div>
        <p class="map-sub" data-i18n="map.sub"></p>
      </div>

      <div class="map-shell">
        <div class="map-canvas">
          <div class="map-viewport" role="group" tabindex="0" data-i18n-aria-label="map.viewport">
            <svg class="food-map" viewBox="0 0 1200 1559" role="img" aria-labelledby="map-svg-title map-svg-desc">
              <title id="map-svg-title" data-i18n="map.svgTitle"></title>
              <desc id="map-svg-desc" data-i18n="map.svgDesc"></desc>
              <rect width="1200" height="1559" fill="none"/>
<!--MAPFRAG-->
<!--PINFRAG-->
            </svg>
          </div>
          <div class="pk-bar">
            <button type="button" class="pk-toggle" id="pk-toggle" aria-pressed="false"
                    aria-controls="pk-caveat"><i class="lg-pk" aria-hidden="true"></i><span data-i18n="map.pk.btn"></span></button>
          </div>
          <div class="map-legend">
            <span><i class="lg lg-route"></i> <span data-i18n="map.lg.route"></span></span>
            <span><i class="lg lg-pin"></i> <span data-i18n="map.lg.pin"></span></span>
            <span><i class="lg lg-zoo"></i> <span data-i18n="map.lg.zoo"></span></span>
            <span><i class="lg lg-cable"></i> <span data-i18n="map.lg.gondola"></span></span>
            <span><i class="lg lg-campus"></i> <span data-i18n="map.lg.campus"></span></span>
            <span><i class="lg lg-pk"></i> <span data-i18n="map.pk.lg"></span></span>
          </div>
          <p class="pk-caveat" id="pk-caveat" data-i18n="map.pk.caveat" hidden></p>
          <p class="sr-only" id="map-status" role="status" aria-live="polite"></p>
        </div>

        <aside class="map-list" aria-labelledby="stops-title">
          <h3 id="stops-title" data-i18n="map.stops"></h3>
<!--STOPSFRAG-->
          <div class="map-note"><b data-i18n="map.note.t"></b><span data-i18n="map.note.b"></span></div>
          <a class="text-link" href="#join"><span data-i18n="map.nominate"></span> <span aria-hidden="true">→</span></a>
        </aside>
      </div>
    </section>

    <section class="plan section" id="pilot" aria-labelledby="plan-title">
      <div><p class="section-kicker" data-i18n="plan.kicker"></p><h2 id="plan-title" data-i18n="plan.h2"></h2></div>
      <div class="timeline">
        <article><span>01</span><div><h3 data-i18n="plan.1t"></h3><p data-i18n="plan.1b"></p><small data-i18n="plan.1d"></small></div></article>
        <article><span>02</span><div><h3 data-i18n="plan.2t"></h3><p data-i18n="plan.2b"></p><small data-i18n="plan.2d"></small></div></article>
        <article><span>03</span><div><h3 data-i18n="plan.3t"></h3><p data-i18n="plan.3b"></p><small data-i18n="plan.3d"></small></div></article>
        <article><span>04</span><div><h3 data-i18n="plan.4t"></h3><p data-i18n="plan.4b"></p><small data-i18n="plan.4d"></small></div></article>
      </div>

      <section class="wayfinding" aria-labelledby="wayfinding-title">
        <div class="wayfinding-head">
          <p class="section-kicker" data-i18n="way.kicker"></p>
          <h3 id="wayfinding-title" data-i18n="way.h3"></h3>
          <p data-i18n="way.body"></p>
        </div>
        <div class="wayfinding-grid">
          <article>
            <figure><img src="assets/wayfinding-sign-mockup.svg" data-i18n-alt="way.sign.alt" alt=""></figure>
            <div><h4 data-i18n="way.sign.t"></h4><p data-i18n="way.sign.b"></p></div>
          </article>
          <article>
            <figure><img src="assets/dianwei-window-decal-mockup.svg" data-i18n-alt="way.decal.alt" alt=""></figure>
            <div><h4 data-i18n="way.decal.t"></h4><p data-i18n="way.decal.b"></p></div>
          </article>
        </div>
        <p class="wayfinding-cap" data-i18n="way.cap"></p>
      </section>

      <div class="spec">
        <div class="spec-head">
          <p class="section-kicker" data-i18n="spec.kicker"></p>
          <h3 data-i18n="spec.h3"></h3>
        </div>
        <dl class="spec-list">
          <div><dt data-i18n="spec.1t"></dt><dd data-i18n="spec.1b"></dd></div>
          <div><dt data-i18n="spec.2t"></dt><dd data-i18n="spec.2b"></dd></div>
          <div><dt data-i18n="spec.3t"></dt><dd data-i18n="spec.3b"></dd></div>
          <div><dt data-i18n="spec.4t"></dt><dd data-i18n="spec.4b"></dd></div>
          <div><dt data-i18n="spec.5t"></dt><dd data-i18n="spec.5b"></dd></div>
          <div class="spec-stop"><dt data-i18n="spec.6t"></dt><dd data-i18n="spec.6b"></dd></div>
        </dl>
      </div>
    </section>

    <section class="metrics section" id="decision" aria-labelledby="decision-title">
      <p class="section-kicker" id="decision-title" data-i18n="metrics.kicker"></p>
      <div><strong data-i18n="metrics.m1"></strong><strong data-i18n="metrics.m2"></strong><strong data-i18n="metrics.m3"></strong><strong data-i18n="metrics.m4"></strong></div>
    </section>

    <section class="method section" id="evidence" aria-labelledby="method-title">
      <div class="map-heading">
        <div><p class="section-kicker" data-i18n="method.kicker"></p><h2 id="method-title" data-i18n="method.h2"></h2></div>
      </div>
      <div class="method-grid">
        <article><h3 data-i18n="method.1t"></h3><p data-i18n="method.1b"></p></article>
        <article><h3 data-i18n="method.2t"></h3><p data-i18n="method.2b"></p></article>
        <article><h3 data-i18n="method.3t"></h3><p data-i18n="method.3b"></p></article>
      </div>
      <div class="method-notes">
        <div class="method-finding"><b data-i18n="method.ft"></b><p data-i18n="method.fb"></p></div>
        <div class="method-limit"><b data-i18n="method.lt"></b><p data-i18n="method.lb"></p></div>
      </div>
    </section>

    <section class="watch section" id="watch" aria-labelledby="watch-title">
      <div class="watch-heading">
        <div><p class="section-kicker" data-i18n="watch.kicker"></p><h2 id="watch-title" data-i18n="watch.h2"></h2></div>
        <p class="watch-sub" data-i18n="watch.sub"></p>
      </div>
      <div class="qr-grid" id="qr-grid"></div>
      <p class="watch-foot" data-i18n="watch.foot"></p>
    </section>


    <section class="join section" id="join" aria-labelledby="join-title">
      <div class="join-copy">
        <p class="section-kicker" data-i18n="join.kicker"></p>
        <h2 id="join-title" data-i18n="join.h2"></h2>
        <p data-i18n="join.body"></p>
        <div class="status-card">
          <b data-i18n="join.status.t"></b>
          <p data-i18n="join.status.b"></p>
          <a class="mail-link" href="mailto:derekyt.chen@gmail.com?subject=Muzha%20Food%20Link">derekyt.chen@gmail.com</a>
        </div>
      </div>
      <form id="petition-form" class="petition-form">
        <p class="form-kicker" data-i18n="form.kicker"></p>
        <label><span data-i18n="form.name"></span><input name="name" required autocomplete="name" data-i18n-placeholder="form.namePh" /></label>
        <label><span data-i18n="form.conn"></span><select name="connection" required>
          <option value="" selected disabled data-i18n="form.select"></option>
          <option data-i18n="form.o1"></option><option data-i18n="form.o2"></option><option data-i18n="form.o3"></option><option data-i18n="form.o4"></option><option data-i18n="form.o5"></option>
        </select></label>
        <label><span data-i18n="form.email"></span><input name="email" type="email" required autocomplete="email" data-i18n-placeholder="form.emailPh" /></label>
        <label class="check"><input type="checkbox" required /><span data-i18n="form.consent"></span></label>
        <button class="button button-coral" type="submit"><span data-i18n="form.submit"></span> <span aria-hidden="true">→</span></button>
        <p class="form-note" data-i18n="form.note"></p>
        <p class="success" id="success" role="status" hidden data-i18n="form.success"></p>
      </form>
    </section>
  </main>


  <footer>
    <span data-i18n="brand"></span>
    <span data-i18n="footer.mid"></span>
    <span><a class="mail-link" href="mailto:derekyt.chen@gmail.com?subject=Muzha%20Food%20Link">derekyt.chen@gmail.com</a></span>
    <span data-i18n="footer.src"></span>
  </footer>
  <script src="i18n.js?v=19"></script>
  <script src="ambient.js?v=9"></script>
  <script src="script.js?v=12"></script>
</body>
</html>
